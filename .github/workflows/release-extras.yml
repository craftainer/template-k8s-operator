# Publishes what the image release does not: the Helm chart (OCI), the OLM
# bundle image and the file-based catalog image, and signs and attests them
# and the released manager image. It is this template's extension of the
# release contract and runs by hand right after each `Release`:
#   gh workflow run release-extras.yml -f tag=vX.Y.Z
# The release lander does this as part of the release and watches the run.
#
# Why a separate, manual workflow: template-docker's release.yml is base-owned
# and has no job that holds `id-token`/`attestations` or runs after `finalize`
# (the OLM bundle must be pinned to the image *index* digest, which only exists
# once `finalize` has run). `workflow_run` (zizmor: dangerous-triggers) is not
# used and not suppressed, and GITHUB_TOKEN-created events start no other
# workflows. So the dispatch is manual. If the contract gains an extension
# point for it (NX1/NX4), this file moves into release.yml and a tombstone line
# in the sync manifest removes it from every operator.
#
# One run per tag at a time (`concurrency`). It never publishes over an
# existing tag: registry tags are mutable, so a second push of the chart,
# bundle or catalog under the same version would give it a new digest and
# orphan the signatures and attestations of the first. The publish job
# therefore fails if any of the three tags exists (scripts/extras/check-absent.sh).
# To finish a run that failed part-way (say the chart and bundle were pushed
# and signing failed), dispatch again with resume=true: an artifact whose tag
# exists is not pushed again, its existing digest is signed and attested
# (signing a digest again is additive); the missing ones are published.
#
# Needs the repository variable OCI_REGISTRY=ghcr.io (the same one the image
# release uses). The signing and attestation happen in sign-attest.yml.
name: Release extras

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the extras for, e.g. v1.2.3
        type: string
        required: true
      resume:
        description: Finish a part-way run - sign the artifacts already published, publish the missing ones, never re-push
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-extras-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Guard
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the ref and the tag
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/extras/check-dispatch.sh >> "$GITHUB_OUTPUT"

      # Only a published release is released: the contract's `release` job
      # creates it after every gate passed. A draft is a failed attempt.
      - name: Check the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::release $RELEASE_TAG is a draft"
            exit 1
          fi

      # The tag must sit in the default branch's history (not on a stray
      # branch): the default branch is "ahead of" or "identical to" it.
      - name: Check the tag is on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_TAG}...${DEFAULT_BRANCH}" --jq .status)
          case "$status" in
            ahead | identical) ;;
            *)
              echo "::error::tag $RELEASE_TAG is not in the history of $DEFAULT_BRANCH (compare status: $status)"
              exit 1
              ;;
          esac

  publish:
    name: Publish the chart, bundle and catalog
    needs: guard
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.guard.outputs.version }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_IMAGE_NAME: ${{ vars.OCI_IMAGE_NAME }}
      OLM_CHANNELS: ${{ vars.OLM_CHANNELS || 'alpha' }}
      OLM_DEFAULT_CHANNEL: ${{ vars.OLM_DEFAULT_CHANNEL || 'alpha' }}
      RESUME: ${{ inputs.resume }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Name the artifacts
        id: refs
        run: scripts/extras/refs.sh >> "$GITHUB_OUTPUT"

      - name: Install helm, kustomize, operator-sdk and opm
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          INSTALL_DIR="$tools" scripts/develop.d/20-k8s-tools.sh helm kustomize operator-sdk opm
          echo "$tools" >> "$GITHUB_PATH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The index digest of the image `finalize` published: what the chart and
      # the bundle pin, and what gets signed.
      - name: Resolve the released image
        id: image
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cannot resolve ${IMAGE}:${VERSION} (got '$digest'); did the Release publish the image?"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Without resume, any existing tag fails the run. With resume, the
      # digests of the existing ones are output and those steps are skipped.
      - name: Refuse to publish over an existing tag
        id: existing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHART: ${{ steps.refs.outputs.chart }}
          BUNDLE: ${{ steps.refs.outputs.bundle }}
          CATALOG: ${{ steps.refs.outputs.catalog }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$RESUME" = "true" ]; then flag=(--resume); fi
          scripts/extras/check-absent.sh "${flag[@]}" "$VERSION" "chart=$CHART" "bundle=$BUNDLE" "catalog=$CATALOG" >> "$GITHUB_OUTPUT"

      - name: Package and push the Helm chart
        id: chart
        if: steps.existing.outputs.chart_digest == ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_REPO: ${{ steps.refs.outputs.chart_repo }}
        run: |
          set -euo pipefail
          scripts/extras/stage-chart.sh "$IMAGE_DIGEST" "$RUNNER_TEMP/staged"
          mkdir "$RUNNER_TEMP/packaged"
          helm package "$RUNNER_TEMP/staged/chart" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/packaged"
          helm push "$RUNNER_TEMP"/packaged/*.tgz "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest=$(sed -n -E 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' "$RUNNER_TEMP/helm-push.log" | head -n1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The CSV is generated for the released image's index digest.
      - name: Generate the bundle and push its image
        id: bundle
        if: steps.existing.outputs.bundle_digest == ''
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUNDLE: ${{ steps.refs.outputs.bundle }}
        run: |
          set -euo pipefail
          scripts/bundle.sh "${IMAGE}@${IMAGE_DIGEST}" "$VERSION" "$OLM_CHANNELS" "$OLM_DEFAULT_CHANNEL"
          docker buildx build -f bundle.Dockerfile --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${BUNDLE}:${VERSION}" --metadata-file "$RUNNER_TEMP/bundle-metadata.json" --push .
          digest=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/bundle-metadata.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build the catalog and push its image
        id: catalog
        if: steps.existing.outputs.catalog_digest == ''
        env:
          BUNDLE: ${{ steps.refs.outputs.bundle }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest || steps.existing.outputs.bundle_digest }}
          CATALOG: ${{ steps.refs.outputs.catalog }}
        run: |
          set -euo pipefail
          scripts/catalog.sh render catalog "${BUNDLE}@${BUNDLE_DIGEST}"
          scripts/catalog.sh dockerfile catalog.Dockerfile
          docker buildx build -f catalog.Dockerfile --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${CATALOG}:${VERSION}" --metadata-file "$RUNNER_TEMP/catalog-metadata.json" --push .
          digest=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/catalog-metadata.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: List the subjects to sign
        id: subjects
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART: ${{ steps.refs.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest || steps.existing.outputs.chart_digest }}
          BUNDLE: ${{ steps.refs.outputs.bundle }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest || steps.existing.outputs.bundle_digest }}
          CATALOG: ${{ steps.refs.outputs.catalog }}
          CATALOG_DIGEST: ${{ steps.catalog.outputs.digest || steps.existing.outputs.catalog_digest }}
        run: |
          set -euo pipefail
          # The image was built by the Release workflow, not here: only the
          # artifacts built in this run get a provenance attestation.
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          e = os.environ
          subjects = [
              {"name": e["IMAGE"], "digest": e["IMAGE_DIGEST"], "provenance": False},
              {"name": e["CHART"], "digest": e["CHART_DIGEST"], "provenance": True},
              {"name": e["BUNDLE"], "digest": e["BUNDLE_DIGEST"], "provenance": True},
              {"name": e["CATALOG"], "digest": e["CATALOG_DIGEST"], "provenance": True},
          ]
          print("subjects=" + json.dumps(subjects, separators=(",", ":")))
          PY

  sign:
    name: Sign ${{ matrix.subject.name }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.publish.outputs.subjects) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/sign-attest.yml
    with:
      subject-name: ${{ matrix.subject.name }}
      subject-digest: ${{ matrix.subject.digest }}
      provenance: ${{ matrix.subject.provenance }}
