# Signs one OCI artifact with cosign (keyless) and attests its provenance with
# GitHub artifact attestations. A reusable workflow (`workflow_call`), called
# by release-extras.yml and by nothing else. It is the only place that holds
# `id-token` and `attestations` permissions, and the signing identity (the
# certificate's workflow ref) is this file, not the caller: that separation is
# what makes the attestation SLSA Build L3 for artifacts the calling workflow
# built and pushed in the same run. See docs/TEMPLATE.md, "Release extras".
#
# When template-docker's own release gains this step (NX1), the calls move
# into the contract and this file becomes a manifest tombstone.
#
# GHCR only: the login uses the workflow's GITHUB_TOKEN.
name: Sign and attest

on:
  workflow_call:
    inputs:
      subject-name:
        description: Image name without tag or digest, e.g. ghcr.io/acme/app-bundle
        type: string
        required: true
      subject-digest:
        description: Digest of the manifest (or index) to sign, sha256:<64 hex>
        type: string
        required: true
      provenance:
        description: Also attest build provenance (false for an artifact another workflow built)
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sign-attest:
    name: Sign and attest
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check the inputs
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        run: |
          set -euo pipefail
          if ! [[ $SUBJECT_NAME =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::not a ghcr.io image name: '$SUBJECT_NAME'"
            exit 1
          fi
          if ! [[ $SUBJECT_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::not a digest: '$SUBJECT_DIGEST'"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.4

      # Keyless: the certificate binds the signature to this workflow's
      # identity through GitHub's OIDC token.
      - name: Sign
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Signatures are additive, but a digest that already verifies (a
          # resumed run) needs no second one.
          if cosign verify "${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/sign-attest\.yml@" >/dev/null 2>&1; then
            echo "already signed: ${SUBJECT_NAME}@${SUBJECT_DIGEST}"
          else
            cosign sign --yes "${SUBJECT_NAME}@${SUBJECT_DIGEST}"
          fi

      - name: Attest the build provenance
        if: ${{ inputs.provenance }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          push-to-registry: true
          create-storage-record: false

      # The signature must verify against this repository's workflow identity.
      - name: Verify the signature
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/sign-attest\.yml@"
