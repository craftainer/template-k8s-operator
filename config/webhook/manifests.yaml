---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-sample-craftainer-dev-v1alpha1-greeting
  failurePolicy: Fail
  name: vgreeting-v1alpha1.kb.io
  rules:
  - apiGroups:
    - sample.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - greetings
  sideEffects: None
